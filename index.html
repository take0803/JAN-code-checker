<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JANチェッカー</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    background: #f2f4f7;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    padding: 22px 10px;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
    font-size: 21px;
}

.file-button {
    display: block;
    background: #2949a8;
    color: white;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    padding: 17px;
    border-radius: 14px;
    cursor: pointer;
}

.file-button input {
    display: none;
}

.status {
    margin-top: 12px;
    padding: 12px;
    background: #f3f4f6;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.7;
}

button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 17px;
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background: #111827;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

.stop {
    background: #6b7280;
}

.clear-button {
    background: #6b7280;
}

#reader {
    width: 100%;
    max-width: 600px;
    margin: 0 auto 15px;
    display: none;
}

.result {
    margin-top: 15px;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    font-weight: bold;
    font-size: 20px;
}

.result.neutral {
    background: #f3f4f6;
    color: #374151;
}

.result.success {
    background: #dcfce7;
    color: #15803d;
}

.result.error {
    background: #fee2e2;
    color: #b91c1c;
}

.jan {
    font-size: 25px;
    margin-top: 8px;
    word-break: break-all;
}

.product {
    margin-top: 8px;
    font-size: 16px;
    font-weight: normal;
    word-break: break-word;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.stat {
    text-align: center;
    padding: 13px 5px;
    background: #f3f4f6;
    border-radius: 12px;
}

.num {
    font-size: 24px;
    font-weight: bold;
}

.lab {
    font-size: 12px;
    color: #6b7280;
    margin-top: 4px;
}

.history-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
}

.history-actions button {
    margin-top: 0;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 25px 10px;
}

.history {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.history-row {
    padding: 15px;
    border-radius: 13px;
    border-left: 7px solid;
}

.history-ok {
    background: #ecfdf5;
    border-left-color: #16a34a;
}

.history-ng {
    background: #fef2f2;
    border-left-color: #dc2626;
}

.history-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
}

.history-no {
    color: #6b7280;
    font-weight: bold;
}

.history-status {
    font-weight: bold;
}

.history-ok .history-status {
    color: #15803d;
}

.history-ng .history-status {
    color: #b91c1c;
}

.history-name {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 6px;
    word-break: break-word;
}

.history-detail {
    color: #4b5563;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
}

@media (max-width: 600px) {

    header {
        font-size: 26px;
    }

    main {
        padding: 10px;
    }

    .card {
        padding: 17px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .history-actions {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header>
JANチェッカー
</header>


<main>


<!-- ================================
     CSV
================================ -->

<div class="card">

<h2>① JANマスタを読み込む</h2>


<label class="file-button">

CSVファイルを選択

<input
    type="file"
    id="csvFile"
    accept=".csv,text/csv"
>

</label>


<div
    id="csvStatus"
    class="status"
>
CSVが選択されていません
</div>


<div style="margin-top:10px;font-size:13px;color:#6b7280;">

1行目：項目名<br>
D列：商品名称<br>
O列：JANコード<br><br>

※O列のJANコードのみを使用します。<br>
※JANコード先頭の「'」は自動的に除去します。

</div>

</div>



<!-- ================================
     カメラ
================================ -->

<div class="card">

<h2>② JANコードをスキャン</h2>


<div id="reader"></div>


<button
    id="start"
    disabled
>
📷 カメラを起動
</button>


<button
    id="stop"
    class="stop"
    style="display:none"
>
カメラを停止
</button>


<div
    id="result"
    class="result neutral"
>
CSVを読み込んでください
</div>

</div>



<!-- ================================
     履歴
================================ -->

<div class="card">

<h2>③ 読み取り履歴</h2>


<div class="history-actions">

<button
    id="downloadCsv"
    disabled
>
📥 結果をCSV保存
</button>


<button
    id="clearHistory"
    class="clear-button"
>
履歴をクリア
</button>

</div>


<div class="stats">


<div class="stat">

<div id="total" class="num">
0
</div>

<div class="lab">
登録JAN
</div>

</div>


<div class="stat">

<div id="scanned" class="num">
0
</div>

<div class="lab">
読み取り件数
</div>

</div>


<div class="stat">

<div id="ok" class="num">
0
</div>

<div class="lab">
登録あり
</div>

</div>


<div class="stat">

<div id="ng" class="num">
0
</div>

<div class="lab">
登録なし
</div>

</div>


</div>


<div
    id="historyEmpty"
    class="empty"
>
まだ読み取り履歴はありません
</div>


<div
    id="history"
    class="history"
></div>


</div>


</main>



<script>


/* ==================================================
   データ
================================================== */

let janMaster = new Map();

let history = [];

let scanner = null;

let scanning = false;

let lastCode = "";

let lastTime = 0;



/* ==================================================
   JANコード正規化
================================================== */

function normalizeJAN(value) {


    if (
        value === null ||
        value === undefined
    ) {

        return null;

    }


    let s = String(value);


    /*
       BOM除去
    */

    s = s.replace(/^\uFEFF/, "");


    /*
       前後空白除去
    */

    s = s.trim();


    /*
       ダブルクォート除去
    */

    s = s.replace(/^"(.*)"$/, "$1");


    /*
       ★今回のCSVの重要ポイント

       先頭のシングルクォートを除去

       '0021200570261
       ↓
       0021200570261
    */

    s = s.replace(/^'+/, "");


    /*
       全角スペース除去
    */

    s = s.replace(/　/g, "");


    /*
       通常スペース除去
    */

    s = s.replace(/\s/g, "");


    /*
       Excelなどで

       4901234567890.0

       となっていた場合
    */

    if (/^\d+\.0+$/.test(s)) {

        s = s.split(".")[0];

    }


    /*
       JAN-8
    */

    if (/^\d{8}$/.test(s)) {

        return s;

    }


    /*
       JAN-13
    */

    if (/^\d{13}$/.test(s)) {

        return s;

    }


    return null;

}



/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;");

}



/* ==================================================
   CSVエスケープ
================================================== */

function escapeCSV(value) {

    return '"' +

        String(value ?? "")
        .replace(/"/g, '""') +

        '"';

}



/* ==================================================
   CSV文字コード
================================================== */

async function decodeCSVFile(file) {


    const buffer =
        await file.arrayBuffer();


    const bytes =
        new Uint8Array(buffer);


    /*
       今回のCSVはCP932
    */

    return new TextDecoder(
        "shift-jis"
    ).decode(
        bytes
    );

}



/* ==================================================
   CSV解析
================================================== */

function parseCSV(text) {


    text =
        text.replace(
            /^\uFEFF/,
            ""
        );


    const rows = [];

    let row = [];

    let cell = "";

    let quoted = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {


        const c = text[i];


        if (c === '"') {


            if (
                quoted &&
                text[i + 1] === '"'
            ) {

                cell += '"';

                i++;

            }

            else {

                quoted = !quoted;

            }

        }


        else if (
            c === "," &&
            !quoted
        ) {


            row.push(cell);

            cell = "";

        }


        else if (
            (
                c === "\r" ||
                c === "\n"
            ) &&
            !quoted
        ) {


            if (
                c === "\r" &&
                text[i + 1] === "\n"
            ) {

                i++;

            }


            row.push(cell);

            rows.push(row);

            row = [];

            cell = "";

        }


        else {

            cell += c;

        }

    }


    if (
        cell !== "" ||
        row.length > 0
    ) {

        row.push(cell);

        rows.push(row);

    }


    return rows;

}



/* ==================================================
   CSV読み込み
================================================== */

document
.getElementById("csvFile")
.addEventListener(
    "change",
    async function(event) {


        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        try {


            const text =
                await decodeCSVFile(
                    file
                );


            const rows =
                parseCSV(
                    text
                );


            if (
                rows.length < 2
            ) {

                throw new Error(
                    "CSVにデータがありません。"
                );

            }


            janMaster.clear();

            history = [];

            lastCode = "";

            lastTime = 0;


            /*
               CSV列

               D列 = 3
               O列 = 14
            */

            const PRODUCT_NAME_COLUMN = 3;

            const JAN_COLUMN = 14;


            let dataRows = 0;

            let validJanRows = 0;


            /*
               2行目から処理
            */

            for (
                let i = 1;
                i < rows.length;
                i++
            ) {


                const row = rows[i];


                /*
                   空行を無視
                */

                if (
                    row.every(
                        value =>
                            String(
                                value ?? ""
                            ).trim() === ""
                    )
                ) {

                    continue;

                }


                dataRows++;


                /*
                   D列
                   商品名称
                */

                const productName =
                    String(
                        row[
                            PRODUCT_NAME_COLUMN
                        ] ?? ""
                    ).trim();


                /*
                   O列
                   JANコード
                */

                const jan =
                    normalizeJAN(
                        row[JAN_COLUMN]
                    );


                /*
                   JANとして認識できない
                */

                if (!jan) {

                    continue;

                }


                validJanRows++;


                /*
                   同一JANは1件
                */

                if (
                    !janMaster.has(jan)
                ) {


                    janMaster.set(

                        jan,

                        {

                            jan: jan,

                            productName:
                                productName

                        }

                    );

                }

            }



            /* ==================================
               件数表示
            ================================== */

            document
            .getElementById("total")
            .textContent =
                janMaster.size.toLocaleString();


            document
            .getElementById("csvStatus")
            .innerHTML =

                "<strong>読み込み完了</strong>" +

                "<br>" +

                "CSVデータ行数：" +

                dataRows.toLocaleString() +

                "件" +

                "<br>" +

                "JAN有効行数：" +

                validJanRows.toLocaleString() +

                "件" +

                "<br>" +

                "登録JAN件数：" +

                janMaster.size.toLocaleString() +
                
                "件";



            /*
               カメラ有効
            */

            document
            .getElementById("start")
            .disabled =
                janMaster.size === 0;


            renderHistory();


            if (
                janMaster.size > 0
            ) {


                setResult(

                    "CSVの読み込みが完了しました<br>" +
                    "カメラでJANコードを読み取れます",

                    "neutral"

                );

            }


        }

        catch (error) {


            console.error(error);


            document
            .getElementById("csvStatus")
            .innerHTML =

                "<strong>CSV読み込みエラー</strong><br>" +

                escapeHtml(
                    error.message
                );


            setResult(

                "CSVを読み込めませんでした",

                "error"

            );

        }

    }
);



/* ==================================================
   結果表示
================================================== */

function setResult(
    text,
    className
) {


    const element =
        document.getElementById(
            "result"
        );


    element.className =
        "result " +
        className;


    element.innerHTML =
        text;

}



/* ==================================================
   カメラ起動
================================================== */

async function startCamera() {


    if (
        janMaster.size === 0
    ) {

        alert(
            "先にCSVを読み込んでください。"
        );

        return;

    }


    if (
        !window.Html5Qrcode
    ) {

        alert(
            "バーコード読み取り機能を読み込めませんでした。ページを再読み込みしてください。"
        );

        return;

    }


    if (
        !window.isSecureContext
    ) {

        alert(
            "カメラを使用するにはHTTPSが必要です。"
        );

        return;

    }


    if (scanning) {

        return;

    }


    try {


        scanner =
            new Html5Qrcode(
                "reader"
            );


        document
        .getElementById("reader")
        .style.display =
            "block";


        document
        .getElementById("start")
        .style.display =
            "none";


        document
        .getElementById("stop")
        .style.display =
            "block";


        setResult(
            "カメラを起動しています…",
            "neutral"
        );


        const config = {


            fps: 10,


            qrbox: {

                width: 280,

                height: 120

            },


            formatsToSupport: [

                Html5QrcodeSupportedFormats.EAN_13,

                Html5QrcodeSupportedFormats.EAN_8

            ]

        };


        await scanner.start(

            {
                facingMode: "environment"
            },

            config,

            onScanSuccess,

            function() {}

        );


        scanning = true;


        setResult(
            "バーコードをカメラに映してください",
            "neutral"
        );

    }

    catch (error) {


        console.error(error);


        scanning = false;


        try {

            if (scanner) {

                await scanner.clear();

            }

        }
        catch (e) {}


        scanner = null;


        document
        .getElementById("reader")
        .style.display =
            "none";


        document
        .getElementById("start")
        .style.display =
            "block";


        document
        .getElementById("stop")
        .style.display =
            "none";


        alert(
            "カメラを起動できませんでした。\n\n" +
            error.message
        );

    }

}



/* ==================================================
   カメラ停止
================================================== */

async function stopCamera() {


    scanning = false;


    if (scanner) {


        try {

            await scanner.stop();

        }
        catch (e) {}


        try {

            await scanner.clear();

        }
        catch (e) {}

    }


    scanner = null;


    document
    .getElementById("reader")
    .style.display =
        "none";


    document
    .getElementById("start")
    .style.display =
        "block";


    document
    .getElementById("stop")
    .style.display =
        "none";


    setResult(
        "カメラを停止しました",
        "neutral"
    );

}



/* ==================================================
   ボタン
================================================== */

document
.getElementById("start")
.addEventListener(
    "click",
    startCamera
);


document
.getElementById("stop")
.addEventListener(
    "click",
    stopCamera
);



/* ==================================================
   JAN読み取り
================================================== */

function onScanSuccess(decodedText) {


    if (!scanning) {

        return;

    }


    const jan =
        normalizeJAN(
            decodedText
        );


    if (!jan) {

        return;

    }


    const now =
        Date.now();


    /*
       同じコードの連続検出を防止
    */

    if (
        jan === lastCode &&
        now - lastTime < 1500
    ) {

        return;

    }


    lastCode = jan;

    lastTime = now;



    /*
       ★履歴に存在するJANは
       2回目以降カウントしない
    */

    if (
        history.some(
            item =>
                item.jan === jan
        )
    ) {


        setResult(

            "⚠️ 読み取り済み" +

            "<div class='jan'>" +

            escapeHtml(jan) +

            "</div>",

            "neutral"

        );


        return;

    }


    /*
       マスタ検索
    */

    const master =
        janMaster.get(jan);


    const registered =
        !!master;



    /*
       履歴追加
    */

    history.push({

        no:
            history.length + 1,

        datetime:
            new Date()
            .toLocaleString(
                "ja-JP"
            ),

        productName:
            master
                ? master.productName
                : "",

        jan:
            jan,

        status:
            registered
                ? "登録あり"
                : "登録なし"

    });


    renderHistory();



    /*
       登録あり
    */

    if (
        registered
    ) {


        setResult(

            "✅ 登録あり" +

            "<div class='jan'>" +

            escapeHtml(jan) +

            "</div>" +

            "<div class='product'>" +

            "商品名称：" +

            escapeHtml(
                master.productName ||
                "—"
            ) +

            "</div>",

            "success"

        );

    }


    /*
       登録なし
    */

    else {


        setResult(

            "❌ 登録なし" +

            "<div class='jan'>" +

            escapeHtml(jan) +

            "</div>",

            "error"

        );

    }

}



/* ==================================================
   履歴表示
================================================== */

function renderHistory() {


    const ok =
        history.filter(
            item =>
                item.status ===
                "登録あり"
        ).length;


    const ng =
        history.filter(
            item =>
                item.status ===
                "登録なし"
        ).length;


    document
    .getElementById("scanned")
    .textContent =
        history.length.toLocaleString();


    document
    .getElementById("ok")
    .textContent =
        ok.toLocaleString();


    document
    .getElementById("ng")
    .textContent =
        ng.toLocaleString();


    document
    .getElementById("downloadCsv")
    .disabled =
        history.length === 0;



    const empty =
        document.getElementById(
            "historyEmpty"
        );


    const area =
        document.getElementById(
            "history"
        );


    if (
        history.length === 0
    ) {


        empty.style.display =
            "block";


        area.innerHTML =
            "";


        return;

    }


    empty.style.display =
        "none";



    area.innerHTML =

        [...history]
        .reverse()
        .map(
            item => {


                const className =

                    item.status ===
                    "登録あり"

                    ?

                    "history-ok"

                    :

                    "history-ng";


                return `

<div class="history-row ${className}">

    <div class="history-top">

        <span class="history-no">
            #${item.no}
        </span>

        <span class="history-status">
            ${item.status}
        </span>

    </div>


    <div class="history-name">

        ${escapeHtml(
            item.productName ||
            "商品名称なし"
        )}

    </div>


    <div class="history-detail">

        JAN：
        ${escapeHtml(item.jan)}

        <br>

        読み取り日時：
        ${escapeHtml(item.datetime)}

    </div>

</div>

`;

            }
        )
        .join("");

}



/* ==================================================
   CSV保存
================================================== */

document
.getElementById("downloadCsv")
.addEventListener(
    "click",
    function() {


        if (
            history.length === 0
        ) {

            return;

        }


        const rows = [

            [
                "No",
                "読み取り日時",
                "商品名称",
                "JANコード",
                "判定"
            ]

        ];


        history.forEach(
            item => {

                rows.push([

                    item.no,

                    item.datetime,

                    item.productName,

                    item.jan,

                    item.status

                ]);

            }
        );


        /*
           BOM付きUTF-8

           Excelで文字化けしにくくする
        */

        const csv =

            "\uFEFF" +

            rows
            .map(
                row =>
                    row
                    .map(
                        escapeCSV
                    )
                    .join(",")
            )
            .join("\r\n");


        const blob =
            new Blob(

                [csv],

                {
                    type:
                        "text/csv;charset=utf-8"
                }

            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        const d =
            new Date();


        const timestamp =

            d.getFullYear() +

            String(
                d.getMonth() + 1
            ).padStart(2, "0") +

            String(
                d.getDate()
            ).padStart(2, "0") +

            "_" +

            String(
                d.getHours()
            ).padStart(2, "0") +

            String(
                d.getMinutes()
            ).padStart(2, "0") +

            String(
                d.getSeconds()
            ).padStart(2, "0");


        link.href = url;


        link.download =
            "JAN読取結果_" +
            timestamp +
            ".csv";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );

    }
);



/* ==================================================
   履歴クリア
================================================== */

document
.getElementById("clearHistory")
.addEventListener(
    "click",
    function() {


        if (
            history.length === 0
        ) {

            return;

        }


        if (
            !confirm(
                "読み取り履歴をすべてクリアしますか？"
            )
        ) {

            return;

        }


        history = [];


        lastCode = "";

        lastTime = 0;


        renderHistory();


        setResult(
            "履歴をクリアしました",
            "neutral"
        );

    }
);


</script>
