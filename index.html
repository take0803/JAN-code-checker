<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JANチェッカー</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    background: #f2f4f7;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    padding: 25px 10px;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
    font-size: 22px;
}

.file-button {
    display: block;
    background: #2949a8;
    color: white;
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    padding: 18px;
    border-radius: 14px;
    cursor: pointer;
}

.file-button input {
    display: none;
}

.status {
    margin-top: 12px;
    padding: 12px;
    background: #f3f4f6;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.7;
}

.description {
    margin-top: 10px;
    color: #6b7280;
    font-size: 13px;
    line-height: 1.7;
}

button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 17px;
    margin-top: 10px;
    font-size: 19px;
    font-weight: bold;
    color: white;
    background: #111827;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

.stop {
    background: #6b7280;
}

.clear-button {
    background: #6b7280;
}

#reader {
    width: 100%;
    max-width: 600px;
    margin: 0 auto 15px;
    display: none;
}

.result {
    margin-top: 15px;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    font-weight: bold;
    font-size: 20px;
}

.result.neutral {
    background: #f3f4f6;
    color: #374151;
}

.result.success {
    background: #dcfce7;
    color: #15803d;
}

.result.error {
    background: #fee2e2;
    color: #b91c1c;
}

.jan {
    font-size: 26px;
    margin-top: 8px;
    word-break: break-all;
}

.product {
    margin-top: 8px;
    font-size: 16px;
    font-weight: normal;
    word-break: break-word;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.stat {
    text-align: center;
    padding: 13px 5px;
    background: #f3f4f6;
    border-radius: 12px;
}

.num {
    font-size: 24px;
    font-weight: bold;
}

.lab {
    font-size: 12px;
    color: #6b7280;
    margin-top: 4px;
}

.history-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
}

.history-actions button {
    margin-top: 0;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 25px 10px;
}

.history {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.history-row {
    padding: 15px;
    border-radius: 13px;
    border-left: 7px solid;
}

.history-ok {
    background: #ecfdf5;
    border-left-color: #16a34a;
}

.history-ng {
    background: #fef2f2;
    border-left-color: #dc2626;
}

.history-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
}

.history-no {
    color: #6b7280;
    font-weight: bold;
}

.history-status {
    font-weight: bold;
}

.history-ok .history-status {
    color: #15803d;
}

.history-ng .history-status {
    color: #b91c1c;
}

.history-name {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 6px;
    word-break: break-word;
}

.history-detail {
    color: #4b5563;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
}

@media (max-width: 600px) {

    header {
        font-size: 27px;
        padding: 23px 10px;
    }

    main {
        padding: 10px;
    }

    .card {
        padding: 17px;
        border-radius: 15px;
    }

    h2 {
        font-size: 21px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .history-actions {
        grid-template-columns: 1fr;
    }

    .jan {
        font-size: 23px;
    }
}

</style>

</head>


<body>


<header>
JANチェッカー
</header>


<main>


<!-- ==================================================
     CSV読み込み
================================================== -->

<div class="card">

<h2>
① JANマスタを読み込む
</h2>


<label class="file-button">

CSVファイルを選択

<input
    type="file"
    id="csvFile"
    accept=".csv,text/csv"
>

</label>


<div
    id="csvStatus"
    class="status"
>
CSVが選択されていません
</div>


<div class="description">

<strong>CSV形式</strong>

<br>

1行目：項目名

<br>

<strong>D列：商品名称</strong>

<br>

<strong>O列：JANコード</strong>

<br><br>

※ O列のJANコードだけをマスタとして使用します。

</div>

</div>



<!-- ==================================================
     カメラ
================================================== -->

<div class="card">

<h2>
② JANコードをスキャン
</h2>


<div id="reader"></div>


<button
    id="start"
    disabled
>
📷 カメラを起動
</button>


<button
    id="stop"
    class="stop"
    style="display:none"
>
カメラを停止
</button>


<div
    id="result"
    class="result neutral"
>
CSVを読み込んでください
</div>

</div>



<!-- ==================================================
     履歴
================================================== -->

<div class="card">

<h2>
③ 読み取り履歴
</h2>


<div class="history-actions">

<button
    id="downloadCsv"
    disabled
>
📥 結果をCSV保存
</button>


<button
    id="clearHistory"
    class="clear-button"
>
履歴をクリア
</button>

</div>



<div class="stats">


<div class="stat">

<div
    id="total"
    class="num"
>
0
</div>

<div class="lab">
登録JAN
</div>

</div>


<div class="stat">

<div
    id="scanned"
    class="num"
>
0
</div>

<div class="lab">
読み取り件数
</div>

</div>


<div class="stat">

<div
    id="ok"
    class="num"
>
0
</div>

<div class="lab">
登録あり
</div>

</div>


<div class="stat">

<div
    id="ng"
    class="num"
>
0
</div>

<div class="lab">
登録なし
</div>

</div>


</div>


<div
    id="historyEmpty"
    class="empty"
>
まだ読み取り履歴はありません
</div>


<div
    id="history"
    class="history"
></div>


</div>


</main>



<script>


/* ==================================================
   データ
================================================== */


/*
   JANマスタ

   key   = JANコード
   value = 商品情報
*/

let janMaster = new Map();


/*
   読み取り履歴
*/

let history = [];


/*
   カメラ
*/

let scanner = null;

let scanning = false;


/*
   同一コード連続読み取り防止
*/

let lastCode = "";

let lastTime = 0;


/*
   CSVの見出し
*/

let headerRow = [];



/* ==================================================
   JANコード正規化
================================================== */

function normalizeJAN(value) {


    if (
        value === null ||
        value === undefined
    ) {

        return null;

    }


    /*
       文字列として取得

       ★数値に変換しない
       ★先頭0を維持
    */

    let s =
        String(value);


    /*
       BOM
    */

    s =
        s.replace(
            /^\uFEFF/,
            ""
        );


    /*
       前後空白
    */

    s =
        s.trim();


    /*
       ダブルクォート
    */

    s =
        s.replace(
            /^"(.*)"$/,
            "$1"
        );


    /*
       全角スペース
    */

    s =
        s.replace(
            /　/g,
            ""
        );


    /*
       通常スペース
    */

    s =
        s.replace(
            /\s/g,
            ""
        );


    /*
       Excel由来の

       4901234567890.0

       に対応

       ※指数表記にはしない
    */

    if (
        /^\d+\.0+$/.test(s)
    ) {

        s =
            s.split(".")[0];

    }


    /*
       JAN-8
    */

    if (
        /^\d{8}$/.test(s)
    ) {

        return s;

    }


    /*
       JAN-13
    */

    if (
        /^\d{13}$/.test(s)
    ) {

        return s;

    }


    return null;

}



/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        );

}



/* ==================================================
   CSVエスケープ
================================================== */

function escapeCSV(value) {

    return '"' +

        String(value ?? "")
        .replace(
            /"/g,
            '""'
        ) +

        '"';

}



/* ==================================================
   結果表示
================================================== */

function setResult(
    text,
    className
) {

    const element =
        document.getElementById(
            "result"
        );

    element.className =
        "result " +
        className;

    element.innerHTML =
        text;

}



/* ==================================================
   CSV文字コード判定
================================================== */

async function decodeCSVFile(file) {


    const buffer =
        await file.arrayBuffer();


    const bytes =
        new Uint8Array(
            buffer
        );


    /*
       UTF-8 BOM確認
    */

    const hasUtf8Bom =

        bytes.length >= 3 &&

        bytes[0] === 0xEF &&

        bytes[1] === 0xBB &&

        bytes[2] === 0xBF;


    /*
       UTF-8 BOMがあればUTF-8
    */

    if (
        hasUtf8Bom
    ) {

        return new TextDecoder(
            "utf-8"
        ).decode(
            bytes
        );

    }


    /*
       UTF-8として正常に
       デコードできるか確認
    */

    try {

        return new TextDecoder(
            "utf-8",
            {
                fatal: true
            }
        ).decode(
            bytes
        );

    }

    catch (error) {

        /*
           今回のCSVなど
           Shift-JIS / CP932
        */

        return new TextDecoder(
            "shift-jis"
        ).decode(
            bytes
        );

    }

}



/* ==================================================
   CSV解析
================================================== */

function parseCSV(text) {


    text =
        text.replace(
            /^\uFEFF/,
            ""
        );


    const rows = [];


    let row = [];

    let cell = "";


    let quoted = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {


        const c =
            text[i];


        /*
           ダブルクォート
        */

        if (
            c === '"'
        ) {


            /*
               "" は "
            */

            if (
                quoted &&
                text[i + 1] === '"'
            ) {

                cell += '"';

                i++;

            }

            else {

                quoted =
                    !quoted;

            }

        }


        /*
           カンマ
        */

        else if (
            c === "," &&
            !quoted
        ) {


            row.push(
                cell
            );

            cell = "";

        }


        /*
           改行
        */

        else if (
            (
                c === "\r" ||
                c === "\n"
            ) &&
            !quoted
        ) {


            /*
               CRLF
            */

            if (
                c === "\r" &&
                text[i + 1] === "\n"
            ) {

                i++;

            }


            row.push(
                cell
            );


            rows.push(
                row
            );


            row = [];


            cell = "";

        }


        else {

            cell += c;

        }

    }


    /*
       最終行
    */

    if (
        cell !== "" ||
        row.length > 0
    ) {

        row.push(
            cell
        );

        rows.push(
            row
        );

    }


    return rows;

}



/* ==================================================
   CSV読み込み
================================================== */

document
.getElementById("csvFile")
.addEventListener(
    "change",
    async function(event) {


        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        try {


            /*
               CSVを文字列化
            */

            const text =
                await decodeCSVFile(
                    file
                );


            /*
               CSV解析
            */

            const rows =
                parseCSV(
                    text
                );


            if (
                rows.length < 2
            ) {

                throw new Error(
                    "CSVにデータがありません。"
                );

            }


            /*
               ヘッダー保存
            */

            headerRow =
                rows[0];


            /*
               マスタ初期化
            */

            janMaster.clear();


            /*
               履歴初期化
            */

            history = [];


            lastCode = "";

            lastTime = 0;



            /* ==========================================
               列番号

               A = 0
               B = 1
               C = 2
               D = 3

               ...

               O = 14
            ========================================== */


            const PRODUCT_NAME_COLUMN =
                3;


            const JAN_COLUMN =
                14;



            /*
               データ件数
            */

            let dataRows = 0;


            /*
               JANが入っている件数
            */

            let validJanRows = 0;


            /*
               2行目から処理
            */

            for (
                let i = 1;
                i < rows.length;
                i++
            ) {


                const row =
                    rows[i];


                /*
                   完全な空行を除外
                */

                if (
                    row.every(
                        function(value) {

                            return String(
                                value ?? ""
                            ).trim() === "";

                        }
                    )
                ) {

                    continue;

                }


                dataRows++;


                /*
                   D列

                   商品名称
                */

                const productName =
                    String(
                        row[
                            PRODUCT_NAME_COLUMN
                        ] ?? ""
                    ).trim();


                /*
                   O列

                   JANコード

                   ★文字列のまま取得
                */

                const rawJan =
                    row[
                        JAN_COLUMN
                    ];


                /*
                   JAN正規化
                */

                const jan =
                    normalizeJAN(
                        rawJan
                    );


                /*
                   JANでない場合
                */

                if (!jan) {

                    continue;

                }


                validJanRows++;


                /*
                   同じJANが
                   複数登録されている場合

                   最初のものを使用
                */

                if (
                    !janMaster.has(jan)
                ) {


                    janMaster.set(

                        jan,

                        {

                            productName:
                                productName,

                            jan:
                                jan

                        }

                    );

                }

            }



            /* ==========================================
               件数表示
            ========================================== */

            document
            .getElementById(
                "total"
            )
            .textContent =
                janMaster.size
                .toLocaleString();



            /*
               CSV読み込み結果
            */

            document
            .getElementById(
                "csvStatus"
            )
            .innerHTML =

                "<strong>読み込み完了</strong>" +

                "<br>" +

                "CSVデータ行数：" +

                dataRows.toLocaleString() +

                "件" +

                "<br>" +

                "JAN有効行数：" +

                validJanRows.toLocaleString() +

                "件" +

                "<br>" +

                "登録JAN件数：" +

                janMaster.size.toLocaleString() +

                "件";



            /*
               カメラ有効化
            */

            document
            .getElementById(
                "start"
            )
            .disabled =
                janMaster.size === 0;



            /*
               履歴表示
            */

            renderHistory();



            if (
                janMaster.size > 0
            ) {


                setResult(

                    "カメラでJANコードをスキャンできます",

                    "neutral"

                );

            }

            else {


                setResult(

                    "O列から有効なJANコードを読み込めませんでした",

                    "error"

                );

            }


        }

        catch (error) {


            console.error(
                error
            );


            document
            .getElementById(
                "csvStatus"
            )
            .innerHTML =

                "<strong>CSV読み込みエラー</strong>" +

                "<br>" +

                escapeHtml(
                    error.message
                );


            setResult(

                "CSVを読み込めませんでした",

                "error"

            );

        }

    }
);



/* ==================================================
   カメラ起動
================================================== */

async function startCamera() {


    if (
        janMaster.size === 0
    ) {


        alert(
            "先にJANマスタCSVを読み込んでください。"
        );


        return;

    }


    if (
        !window.Html5Qrcode
    ) {


        alert(

            "バーコード読み取り機能を読み込めませんでした。\n\n" +

            "ページを再読み込みしてください。"

        );


        return;

    }


    if (
        !window.isSecureContext
    ) {


        alert(

            "カメラにはHTTPS接続が必要です。\n" +

            "GitHub PagesのURLから開いてください。"

        );


        return;

    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {


        alert(
            "このブラウザではカメラを利用できません。"
        );


        return;

    }


    if (scanning) {

        return;

    }


    try {


        scanner =
            new Html5Qrcode(
                "reader"
            );


        document
        .getElementById(
            "reader"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "start"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "stop"
        )
        .style.display =
            "block";


        setResult(

            "カメラを起動しています…",

            "neutral"

        );


        const config = {


            fps: 10,


            qrbox: {

                width: 280,

                height: 120

            },


            formatsToSupport: [

                Html5QrcodeSupportedFormats.EAN_13,

                Html5QrcodeSupportedFormats.EAN_8

            ]

        };


        /*
           背面カメラ
        */

        await scanner.start(

            {
                facingMode: {
                    exact: "environment"
                }
            },

            config,

            onScanSuccess,

            function() {}

        );


        scanning = true;


        setResult(

            "バーコードをカメラに映してください",

            "neutral"

        );


    }

    catch (error) {


        console.error(
            error
        );


        scanning = false;


        try {

            if (scanner) {

                await scanner.clear();

            }

        }

        catch (e) {}


        scanner = null;


        document
        .getElementById(
            "reader"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "start"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "stop"
        )
        .style.display =
            "none";


        alert(

            "カメラを起動できませんでした。\n\n" +

            error.message

        );

    }

}



/* ==================================================
   カメラ停止
================================================== */

async function stopCamera() {


    scanning = false;


    if (scanner) {


        try {

            await scanner.stop();

        }

        catch (e) {}


        try {

            await scanner.clear();

        }

        catch (e) {}

    }


    scanner = null;


    document
    .getElementById(
        "reader"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "start"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "stop"
    )
    .style.display =
        "none";


    setResult(

        "カメラを停止しました",

        "neutral"

    );

}


document
.getElementById("start")
.addEventListener(
    "click",
    startCamera
);


document
.getElementById("stop")
.addEventListener(
    "click",
    stopCamera
);



/* ==================================================
   JAN読み取り
================================================== */

function onScanSuccess(
    decodedText
) {


    if (!scanning) {

        return;

    }


    /*
       カメラから取得したJAN
    */

    const jan =
        normalizeJAN(
            decodedText
        );


    if (!jan) {

        return;

    }


    const now =
        Date.now();


    /*
       同じJANがカメラに
       連続して映った場合は無視
    */

    if (
        jan === lastCode &&
        now - lastTime < 1500
    ) {

        return;

    }


    lastCode = jan;

    lastTime = now;



    /*
       ==========================================
       ★同じJANはカウントしない
       ==========================================
    */

    const alreadyScanned =
        history.some(
            function(item) {

                return item.jan === jan;

            }
        );


    if (
        alreadyScanned
    ) {


        setResult(

            "⚠️ このJANは読み取り済み" +

            "<div class='jan'>" +

            escapeHtml(
                jan
            ) +

            "</div>",

            "neutral"

        );


        return;

    }



    /*
       マスタ検索
    */

    const master =
        janMaster.get(
            jan
        );


    const registered =
        !!master;



    /*
       履歴データ
    */

    const item = {


        no:
            history.length + 1,


        datetime:
            new Date()
            .toLocaleString(
                "ja-JP"
            ),


        /*
           マスタに登録されている
           商品名称
        */

        productName:
            master
                ? master.productName
                : "",


        /*
           読み取ったJAN
        */

        jan:
            jan,


        status:
            registered
                ? "登録あり"
                : "登録なし"

    };


    /*
       履歴追加
    */

    history.push(
        item
    );


    /*
       履歴表示
    */

    renderHistory();



    /* ==========================================
       登録あり
    ========================================== */

    if (
        registered
    ) {


        setResult(

            "✅ 登録あり" +

            "<div class='jan'>" +

            escapeHtml(
                jan
            ) +

            "</div>" +

            "<div class='product'>" +

            "商品名称：" +

            escapeHtml(
                master.productName ||
                "—"
            ) +

            "</div>",

            "success"

        );

    }


    /* ==========================================
       登録なし
    ========================================== */

    else {


        setResult(

            "❌ 登録なし" +

            "<div class='jan'>" +

            escapeHtml(
                jan
            ) +

            "</div>",

            "error"

        );

    }

}



/* ==================================================
   履歴表示
================================================== */

function renderHistory() {


    /*
       登録あり
    */

    const ok =
        history.filter(
            function(item) {

                return item.status ===
                    "登録あり";

            }
        ).length;


    /*
       登録なし
    */

    const ng =
        history.filter(
            function(item) {

                return item.status ===
                    "登録なし";

            }
        ).length;



    document
    .getElementById(
        "scanned"
    )
    .textContent =
        history.length
        .toLocaleString();


    document
    .getElementById(
        "ok"
    )
    .textContent =
        ok.toLocaleString();


    document
    .getElementById(
        "ng"
    )
    .textContent =
        ng.toLocaleString();


    document
    .getElementById(
        "downloadCsv"
    )
    .disabled =
        history.length === 0;



    const empty =
        document.getElementById(
            "historyEmpty"
        );


    const area =
        document.getElementById(
            "history"
        );



    if (
        history.length === 0
    ) {


        empty.style.display =
            "block";


        area.innerHTML =
            "";


        return;

    }


    empty.style.display =
        "none";



    /*
       新しいものを上に表示
    */

    area.innerHTML =

        [...history]

        .reverse()

        .map(
            function(item) {


                const className =

                    item.status ===
                    "登録あり"

                    ?

                    "history-ok"

                    :

                    "history-ng";


                return `

<div class="history-row ${className}">


    <div class="history-top">


        <span class="history-no">

            #${item.no}

        </span>


        <span class="history-status">

            ${item.status}

        </span>


    </div>



    <div class="history-name">

        商品名称：

        ${escapeHtml(
            item.productName ||
            "—"
        )}

    </div>



    <div class="history-detail">


        JAN：

        ${escapeHtml(
            item.jan
        )}


        <br>


        読み取り日時：

        ${escapeHtml(
            item.datetime
        )}


    </div>


</div>

`;

            }
        )

        .join("");

}



/* ==================================================
   CSV保存
================================================== */

document
.getElementById(
    "downloadCsv"
)
.addEventListener(
    "click",
    function() {


        if (
            history.length === 0
        ) {

            return;

        }


        /*
           結果CSV

           商品コードは使用しない
        */

        const rows = [


            [

                "No",

                "読み取り日時",

                "商品名称",

                "JANコード",

                "判定"

            ]


        ];



        history.forEach(
            function(item) {


                rows.push([

                    item.no,

                    item.datetime,

                    item.productName,

                    item.jan,

                    item.status

                ]);

            }
        );



        /*
           CSV化
        */

        const csv =

            "\uFEFF" +

            rows

            .map(
                function(row) {

                    return row
                        .map(
                            escapeCSV
                        )
                        .join(",");

                }
            )

            .join(
                "\r\n"
            );



        /*
           ファイル生成
        */

        const blob =
            new Blob(

                [csv],

                {

                    type:
                        "text/csv;charset=utf-8"

                }

            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );



        /*
           ファイル名
        */

        const d =
            new Date();


        const timestamp =


            d.getFullYear() +


            String(
                d.getMonth() + 1
            ).padStart(
                2,
                "0"
            ) +


            String(
                d.getDate()
            ).padStart(
                2,
                "0"
            ) +


            "_" +


            String(
                d.getHours()
            ).padStart(
                2,
                "0"
            ) +


            String(
                d.getMinutes()
            ).padStart(
                2,
                "0"
            ) +


            String(
                d.getSeconds()
            ).padStart(
                2,
                "0"
            );



        link.href =
            url;


        link.download =

            "JAN読取結果_" +

            timestamp +

            ".csv";



        document
        .body
        .appendChild(
            link
        );


        link.click();


        link.remove();



        setTimeout(
            function() {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );

    }
);



/* ==================================================
   履歴クリア
================================================== */

document
.getElementById(
    "clearHistory"
)
.addEventListener(
    "click",
    function() {


        if (
            history.length === 0
        ) {

            return;

        }


        if (
            !confirm(
                "読み取り履歴をすべてクリアしますか？"
            )
        ) {

            return;

        }


        history = [];


        lastCode = "";


        lastTime = 0;


        renderHistory();


        setResult(

            "履歴をクリアしました",

            "neutral"

        );

    }
);


</script>
