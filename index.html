<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JANチェッカー</title>

<!--
  バーコード読取ライブラリ。
  旧版で使用していた ZXingBrowser のグローバル変数方式をやめ、
  html5-qrcode を使用します。
-->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f3f4f6;
    color: #111827;
}
header {
    background: #1f2937;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 24px;
    font-weight: bold;
}
main { max-width: 600px; margin: auto; padding: 16px; }
.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
h2 { margin-top: 0; font-size: 20px; }
.file-button {
    display: block;
    width: 100%;
    padding: 16px;
    background: #2563eb;
    color: white;
    text-align: center;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}
input[type="file"] { display: none; }
.status {
    margin-top: 14px;
    padding: 14px;
    background: #f3f4f6;
    border-radius: 10px;
    word-break: break-word;
}
#reader {
    width: 100%;
    display: none;
    overflow: hidden;
    border-radius: 14px;
}
#reader video {
    width: 100% !important;
    height: auto !important;
    border-radius: 14px;
}
button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 16px;
    margin-top: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: #111827;
    color: white;
}
button:disabled { opacity: 0.5; }
.stop-button { background: #dc2626; }
.result {
    margin-top: 15px;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    word-break: break-word;
}
.neutral { background: #e5e7eb; color: #374151; }
.success { background: #dcfce7; color: #166534; }
.error { background: #fee2e2; color: #991b1b; }
.jan-code { margin-top: 10px; font-size: 20px; font-weight: normal; }
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}
.stat {
    background: #f9fafb;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
}
.number { font-size: 24px; font-weight: bold; }
.label { font-size: 13px; color: #6b7280; }
.description {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.6;
}
.debug {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: #f9fafb;
    color: #6b7280;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>

<body>
<header>JANチェッカー</header>

<main>
<div class="card">
    <h2>① JANマスタを読み込む</h2>

    <label class="file-button">
        CSVファイルを選択
        <input type="file" id="csvFile" accept=".csv,text/csv">
    </label>

    <div id="csvStatus" class="status">CSVが選択されていません</div>
</div>

<div class="card">
    <h2>② JANコードをスキャン</h2>

    <div id="reader"></div>

    <button id="startCamera" disabled>📷 カメラを起動</button>

    <button id="stopCamera" class="stop-button" style="display:none;">
        カメラを停止
    </button>

    <div id="result" class="result neutral">
        CSVを読み込んでください
    </div>

    <p class="description">
        バーコードをカメラに映してください。<br>
        JAN-8、JAN-13に対応しています。
    </p>

    <div id="debug" class="debug" style="display:none;"></div>
</div>

<div class="card">
    <h2>読み取り状況</h2>

    <div class="stats">
        <div class="stat">
            <div id="totalCount" class="number">0</div>
            <div class="label">登録JAN</div>
        </div>

        <div class="stat">
            <div id="successCount" class="number">0</div>
            <div class="label">登録あり</div>
        </div>

        <div class="stat">
            <div id="errorCount" class="number">0</div>
            <div class="label">登録なし</div>
        </div>
    </div>
</div>
</main>

<script>
let janList = new Set();
let successCount = 0;
let errorCount = 0;
let scanner = null;
let scanning = false;
let lastJAN = "";
let lastScanTime = 0;

function normalizeJAN(value) {
    let s = String(value ?? "")
        .trim()
        .replace(/"/g, "")
        .replace(/\s/g, "");

    // Excel等で 4901234567890.0 のようになっている場合にも対応
    if (/^\d+\.0+$/.test(s)) {
        s = s.split(".")[0];
    }

    s = s.replace(/\D/g, "");

    if (s.length === 8 || s.length === 13) return s;
    return null;
}

function setResult(text, type) {
    const el = document.getElementById("result");
    el.className = "result " + type;
    el.innerHTML = text;
}

function setDebug(text) {
    const el = document.getElementById("debug");
    el.style.display = "block";
    el.textContent = text;
}

function isReaderLibraryReady() {
    return typeof Html5Qrcode !== "undefined";
}

/* CSV読み込み */
document.getElementById("csvFile").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        const text = e.target.result.replace(/^\uFEFF/, "");
        janList.clear();

        const rows = text.split(/\r?\n/);

        rows.forEach(row => {
            // 元アプリと同じく、CSV内の全セルから8桁/13桁の数字を探す
            const columns = row.split(",");
            columns.forEach(column => {
                const jan = normalizeJAN(column);
                if (jan) janList.add(jan);
            });
        });

        document.getElementById("totalCount").textContent =
            janList.size.toLocaleString();

        document.getElementById("csvStatus").textContent =
            "読み込み完了：" + janList.size.toLocaleString() + "件";

        document.getElementById("startCamera").disabled = janList.size === 0;

        setResult("カメラでJANコードをスキャンできます", "neutral");
    };

    reader.onerror = function() {
        document.getElementById("csvStatus").textContent =
            "CSVを読み込めませんでした";
    };

    reader.readAsText(file, "UTF-8");
});

/* カメラ開始 */
document.getElementById("startCamera").addEventListener("click", startCamera);

async function startCamera() {
    if (janList.size === 0) {
        alert("先にJANマスタCSVを読み込んでください。");
        return;
    }

    if (!isReaderLibraryReady()) {
        alert(
            "バーコード読み取り機能を読み込めませんでした。\n\n" +
            "インターネット接続を確認して、ページを再読み込みしてください。"
        );
        return;
    }

    if (!window.isSecureContext) {
        alert(
            "カメラを使用するにはHTTPS接続が必要です。\n\n" +
            "GitHub PagesのURL（https://～）から開いてください。"
        );
        return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert(
            "このブラウザではカメラ機能を利用できません。\n" +
            "iPhoneではSafariまたはChromeの最新版を使用してください。"
        );
        return;
    }

    if (scanning) return;

    try {
        scanner = new Html5Qrcode("reader");

        document.getElementById("reader").style.display = "block";
        document.getElementById("startCamera").style.display = "none";
        document.getElementById("stopCamera").style.display = "block";

        setResult("カメラを起動しています…", "neutral");

        const config = {
            fps: 10,
            qrbox: { width: 280, height: 120 },
            aspectRatio: 1.777778,
            formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8
            ]
        };

        // facingModeを最初から指定せず、端末側のカメラ選択を使う。
        // iPhoneでenvironment指定が原因になるケースを避ける。
        await scanner.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanFailure
        );

        scanning = true;
        setResult("バーコードをカメラに映してください", "neutral");

    } catch (error) {
        console.error("camera start error:", error);

        scanning = false;

        try {
            if (scanner) await scanner.clear();
        } catch (e) {}

        scanner = null;

        document.getElementById("reader").style.display = "none";
        document.getElementById("startCamera").style.display = "block";
        document.getElementById("stopCamera").style.display = "none";

        let detail = "";
        if (error && error.message) detail = error.message;
        else detail = String(error);

        setDebug(
            "カメラ起動エラー:\n" +
            detail +
            "\n\nURL: " + location.href +
            "\nHTTPS: " + location.protocol +
            "\nSecure Context: " + window.isSecureContext
        );

        if (String(detail).toLowerCase().includes("permission")) {
            alert(
                "カメラへのアクセスが許可されていません。\n\n" +
                "iPhoneの「設定」→「Safari（またはChrome）」→カメラの設定を確認してください。"
            );
        } else {
            alert(
                "カメラを起動できませんでした。\n\n" +
                "ブラウザのカメラ許可と、HTTPSでアクセスしていることを確認してください。\n\n" +
                "詳細は画面下のエラー情報に表示しています。"
            );
        }
    }
}

function onScanSuccess(decodedText) {
    if (!scanning) return;

    const jan = normalizeJAN(decodedText);
    if (!jan) return;

    const now = Date.now();

    if (jan === lastJAN && now - lastScanTime < 1500) return;

    lastJAN = jan;
    lastScanTime = now;

    checkJAN(jan);
}

function onScanFailure(errorMessage) {
    // 読み取り中の「見つからない」は通常の状態なので表示しない
}

function checkJAN(jan) {
    if (janList.has(jan)) {
        successCount++;

        document.getElementById("successCount").textContent =
            successCount.toLocaleString();

        setResult(
            "✅ 登録あり<div class='jan-code'>" + jan + "</div>",
            "success"
        );
    } else {
        errorCount++;

        document.getElementById("errorCount").textContent =
            errorCount.toLocaleString();

        setResult(
            "❌ 登録なし<div class='jan-code'>" + jan + "</div>",
            "error"
        );
    }
}

/* カメラ停止 */
document.getElementById("stopCamera").addEventListener("click", stopCamera);

async function stopCamera() {
    scanning = false;

    if (scanner) {
        try {
            await scanner.stop();
        } catch (e) {
            console.log(e);
        }

        try {
            await scanner.clear();
        } catch (e) {
            console.log(e);
        }
    }

    scanner = null;

    document.getElementById("reader").style.display = "none";
    document.getElementById("startCamera").style.display = "block";
    document.getElementById("stopCamera").style.display = "none";

    setResult("カメラを停止しました", "neutral");
}

/*
 * ページを開いた時点でライブラリが読み込めているか確認。
 * これにより、今回のような「読み込めませんでした」の原因を切り分けやすくする。
 */
window.addEventListener("load", function() {
    setTimeout(function() {
        if (!isReaderLibraryReady()) {
            setDebug(
                "バーコードライブラリを読み込めませんでした。\n\n" +
                "ページ: " + location.href
            );
        }
    }, 1500);
});
</script>
</body>
</html>
